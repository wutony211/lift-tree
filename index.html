<!DOCTYPE html>
<html lang="zh-Hant">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>我的十年人生樹</title>

<script src="https://unpkg.com/html2canvas@1.4.1/dist/html2canvas.min.js"></script>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    padding:20px;
    font-family:"Microsoft JhengHei",sans-serif;
    background:#f5f7fa;
}

.container{
    max-width:1600px;
    margin:auto;
}

.form-card{

    background:white;

    padding:20px;

    border-radius:12px;

    box-shadow:0 2px 8px rgba(0,0,0,.15);
}

textarea,
input{

    width:100%;

    padding:10px;

    margin-top:5px;
    margin-bottom:10px;

    border:1px solid #ccc;

    border-radius:8px;
}

button{

    background:#2563eb;

    color:white;

    border:none;

    padding:12px 20px;

    border-radius:8px;

    cursor:pointer;

    margin-right:10px;
}

button:hover{
    background:#1d4ed8;
}

.poster{

    width:1500px;

    height:1000px;

    background:white;

    position:relative;

    border:2px solid #333;

    margin-top:20px;

    overflow:hidden;
}

.left-panel{

    position:absolute;

    left:20px;

    top:20px;

    width:700px;

    height:940px;
}

.letter-box{

    border:2px dashed #888;

    padding:15px;

    height:850px;

    overflow:hidden;

    white-space:pre-wrap;

    line-height:1.8;
}

.tree-area{

    position:absolute;

    right:0;

    top:0;

    width:760px;

    height:1000px;
}

.tree-area img{

    width:100%;

    display:block;
}

.overlay{

    position:absolute;

    display:flex;

    align-items:center;

    justify-content:center;

    text-align:center;

    font-size:13px;

    line-height:1.2;

    padding:4px;

    word-break:break-word;
}

/* ===== 葉片 ===== */

.leaf{

    width:100px;

    height:60px;

    background:rgba(190,255,190,.45);

    border-radius:12px;
}

.leaf1{left:90px;top:90px;}
.leaf2{left:300px;top:20px;}
.leaf3{left:530px;top:90px;}

.leaf4{left:45px;top:280px;}
.leaf5{left:270px;top:250px;}
.leaf6{left:560px;top:280px;}

/* ===== 花朵 ===== */

.flower{

    width:70px;

    height:70px;

    border-radius:50%;

    background:rgba(255,220,230,.65);

    font-size:12px;
}

.flower1{left:250px;top:205px;}
.flower2{left:475px;top:205px;}

.flower3{left:190px;top:385px;}
.flower4{left:500px;top:390px;}

/* ===== 果實 ===== */

.fruit{

    width:90px;

    height:90px;

    border-radius:50%;

    background:rgba(255,222,170,.75);

    font-size:12px;
}

.fruit1{left:90px;top:510px;}
.fruit2{left:580px;top:510px;}

/* ===== 樹幹 ===== */

.trunk{

    width:150px;

    height:100px;

    background:rgba(220,220,220,.75);

    border-radius:10px;

    font-weight:bold;

    left:300px;

    top:560px;
}

/* ===== 樹根 ===== */

.root{

    width:75px;

    height:55px;

    border-radius:12px;

    background:rgba(220,220,220,.65);

    font-size:12px;
}

.root1{left:20px;bottom:100px;}
.root2{left:150px;bottom:70px;}
.root3{left:300px;bottom:30px;}

.root4{left:390px;bottom:30px;}
.root5{left:540px;bottom:70px;}
.root6{left:660px;bottom:100px;}

.quote{

    text-align:center;

    font-size:24px;

    font-weight:bold;

    margin-bottom:20px;

    color:#1e3a8a;
}

@media(max-width:1200px){

.poster{

    width:100%;
    height:auto;
}

}

</style>
</head>

<body>

<div class="container">

<div class="form-card">

<h1>🌳 我的十年人生樹</h1>

<input id="quote" placeholder="Never Forget Your Original Intention">

<input id="trunk" placeholder="現在的自己">

<textarea id="roots" rows="6"
placeholder="六個核心價值(每行一個)&#10;家庭&#10;誠信&#10;學習..."></textarea>

<textarea id="leaves" rows="6"
placeholder="六個方法(每行一個)"></textarea>

<textarea id="flowers" rows="4"
placeholder="四個成果(每行一個)"></textarea>

<textarea id="fruits" rows="2"
placeholder="兩個人生夢想(每行一個)"></textarea>

<textarea id="letter"
rows="10"
placeholder="給十年後的自己"></textarea>

<button onclick="generatePoster()">
生成人生樹海報
</button>

<button onclick="downloadPoster()">
下載 PNG
</button>

</div>

<div id="result"></div>

</div>

<script>

function getLines(id,count){

 const arr =
 document.getElementById(id)
 .value
 .split("\\n")
 .filter(v=>v.trim()!='');

 while(arr.length<count){
   arr.push("");
 }

 return arr;
}

function generatePoster(){

 const roots   = getLines("roots",6);
 const leaves  = getLines("leaves",6);
 const flowers = getLines("flowers",4);
 const fruits  = getLines("fruits",2);

 const trunk =
 document.getElementById("trunk").value;

 const quote =
 document.getElementById("quote").value;

 const letter =
 document.getElementById("letter").value;

 document.getElementById("result").innerHTML = `

 <div class="poster" id="poster">

     <div class="left-panel">

         <div class="quote">${quote}</div>

         <h2>💌 給十年後的自己</h2>

         <div class="letter-box">
         ${letter.replace(/\\n/g,"<br>")}
         </div>

     </div>

     <div class="tree-area">

         <img src="tree-template.png">

         <div class="overlay leaf leaf1">${leaves[0]}</div>
         <div class="overlay leaf leaf2">${leaves[1]}</div>
         <div class="overlay leaf leaf3">${leaves[2]}</div>
         <div class="overlay leaf leaf4">${leaves[3]}</div>
         <div class="overlay leaf leaf5">${leaves[4]}</div>
         <div class="overlay leaf leaf6">${leaves[5]}</div>

         <div class="overlay flower flower1">${flowers[0]}</div>
         <div class="overlay flower flower2">${flowers[1]}</div>
         <div class="overlay flower flower3">${flowers[2]}</div>
         <div class="overlay flower flower4">${flowers[3]}</div>

         <div class="overlay fruit fruit1">${fruits[0]}</div>
         <div class="overlay fruit fruit2">${fruits[1]}</div>

         <div class="overlay trunk">
             ${trunk}
         </div>

         <div class="overlay root root1">${roots[0]}</div>
         <div class="overlay root root2">${roots[1]}</div>
         <div class="overlay root root3">${roots[2]}</div>
         <div class="overlay root root4">${roots[3]}</div>
         <div class="overlay root root5">${roots[4]}</div>
         <div class="overlay root root6">${roots[5]}</div>

     </div>

 </div>

 `;
}

async function downloadPoster(){

 const poster =
 document.getElementById("poster");

 if(!poster){

   alert("請先產生海報");

   return;
 }

 const canvas =
 await html2canvas(
    poster,
    {
      scale:2,
      useCORS:true,
      backgroundColor:"#ffffff"
    }
 );

 const link =
 document.createElement("a");

 link.download =
 "LifeTree.png";

 link.href =
 canvas.toDataURL("image/png");

 link.click();
}

</script>

</body>
</html>
