<!DOCTYPE html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Life Tree 2.1 Enhanced</title><script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script><script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script><style>body{font-family:Arial,'Microsoft JhengHei';background:#eef2f7;margin:0;padding:20px}.card{background:#fff;border-radius:12px;padding:16px;max-width:1200px;margin:auto}textarea,input{width:100%;box-sizing:border-box;margin:6px 0;padding:8px}button{padding:10px 14px;background:#2563eb;color:#fff;border:0;border-radius:8px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}#poster{background:#fff;width:1400px;min-height:900px;border:2px solid #333;display:flex;padding:20px}.left,.right{width:50%}.letter{border:1px dashed #888;padding:10px;min-height:700px;white-space:pre-wrap}.node{border:2px solid #333;border-radius:18px;padding:8px;margin:8px 0}.actions{margin-top:10px}@media(max-width:900px){.grid{grid-template-columns:1fr}#poster{width:100%;display:block}.left,.right{width:100%}}</style></head><body><div class='card'><h1>Life Tree 2.1</h1><input id='site' placeholder='Website URL'><div id='qr'></div><button onclick='generateQR()'>產生QR Code</button><div class='grid'><div><input id='quote' placeholder='座右銘'><textarea id='letter' rows='8' placeholder='給十年後的自己'></textarea></div><div><textarea id='root' placeholder='樹根'></textarea><textarea id='trunk' placeholder='樹幹'></textarea><textarea id='branch' placeholder='樹枝'></textarea><textarea id='leaf' placeholder='樹葉'></textarea><textarea id='flower' placeholder='花朵'></textarea><textarea id='fruit' placeholder='果實'></textarea></div></div><button onclick='generatePoster()'>生成人生樹海報</button><div id='out'></div></div><script>function generateQR(){const d=document.getElementById('qr');d.innerHTML='';new QRCode(d,document.getElementById('site').value||location.href);}function generatePoster(){const q=document.getElementById('quote').value,l=document.getElementById('letter').value,r=document.getElementById('root').value,t=document.getElementById('trunk').value,b=document.getElementById('branch').value,le=document.getElementById('leaf').value,f=document.getElementById('flower').value,fr=document.getElementById('fruit').value;document.getElementById('out').innerHTML=`<div id="poster"><div class="left"><h2>${q}</h2><h3>給十年後的自己</h3><div class="letter">${l.replace(/
/g,'<br>')}</div></div><div class="right"><div class="node">🍎 ${fr}</div><div class="node">🌸 ${f}</div><div class="node">🍃 ${le}</div><div class="node">🌿 ${b}</div><div class="node">🌳 ${t}</div><div class="node">🌱 ${r}</div></div></div><div class='actions'><button onclick='downloadP()'>下載PNG</button><button onclick='openImage()'>開啟圖片</button></div>`;}async function downloadP(){const poster=document.getElementById('poster');if(!poster){alert('請先產生海報');return;}const canvas=await html2canvas(poster,{scale:2,useCORS:true,backgroundColor:'#fff'});canvas.toBlob(async blob=>{if(!blob)return;const file=new File([blob],'LifeTree.png',{type:'image/png'});if(navigator.canShare&&navigator.canShare({files:[file]})){try{await navigator.share({files:[file],title:'Life Tree'});return;}catch(e){}}const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='LifeTree.png';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);});}async function openImage(){const poster=document.getElementById('poster');if(!poster)return;const canvas=await html2canvas(poster,{scale:2});const w=window.open();w.document.write('<img style="width:100%" src="'+canvas.toDataURL('image/png')+'">');}</script></body></html>
