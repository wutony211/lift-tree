<!DOCTYPE html>
<html lang="zh-Hant">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>我的十年人生樹</title>

<style>

body{
    margin:0;
    background:#f5f5f5;
    font-family:"Microsoft JhengHei",sans-serif;
}

.container{
    max-width:1600px;
    margin:auto;
    padding:20px;
}

.form{
    background:white;
    padding:20px;
    border-radius:12px;
}

textarea,input{
    width:100%;
    padding:8px;
    margin:5px 0;
    box-sizing:border-box;
}

button{
    padding:10px 20px;
    background:#2563eb;
    color:white;
    border:none;
    border-radius:8px;
}

#poster{
    margin-top:20px;
    position:relative;
    width:1500px;
    height:1000px;
    background:white;
    border:2px solid #333;
}

.left-panel{
    position:absolute;
    left:20px;
    top:20px;
    width:700px;
    height:920px;
}

.future-letter{
    border:2px dashed #999;
    height:850px;
    padding:15px;
    white-space:pre-wrap;
}

.tree{
    position:absolute;
    right:0;
    top:0;
    width:750px;
}

.tree img{
    width:100%;
}

/* 果實 */

.fruit1{
    position:absolute;
    top:420px;
    left:40px;
    width:90px;
    text-align:center;
}

.fruit2{
    position:absolute;
    top:420px;
    right:30px;
    width:90px;
    text-align:center;
}

/* 花朵 */

.flower1{
    position:absolute;
    top:150px;
    left:220px;
    width:90px;
}

.flower2{
    position:absolute;
    top:160px;
    right:190px;
    width:90px;
}

.flower3{
    position:absolute;
    top:330px;
    left:150px;
    width:90px;
}

.flower4{
    position:absolute;
    top:330px;
    right:150px;
    width:90px;
}

/* 葉片 */

.leaf1{position:absolute;top:10px;left:200px;width:120px;}
.leaf2{position:absolute;top:15px;left:420px;width:120px;}
.leaf3{position:absolute;top:120px;left:30px;width:120px;}
.leaf4{position:absolute;top:120px;right:10px;width:120px;}
.leaf5{position:absolute;top:250px;left:0px;width:120px;}
.leaf6{position:absolute;top:250px;right:0px;width:120px;}

/* 樹幹 */

.trunk{
    position:absolute;
    top:520px;
    left:320px;
    width:120px;
    text-align:center;
    font-weight:bold;
}

/* 根部 */

.root1{position:absolute;bottom:120px;left:30px;width:80px;}
.root2{position:absolute;bottom:80px;left:180px;width:80px;}
.root3{position:absolute;bottom:50px;left:320px;width:80px;}
.root4{position:absolute;bottom:50px;right:320px;width:80px;}
.root5{position:absolute;bottom:80px;right:180px;width:80px;}
.root6{position:absolute;bottom:120px;right:30px;width:80px;}

.label{
    font-size:14px;
    text-align:center;
    line-height:1.2;
}

</style>

</head>

<body>

<div class="container">

<div class="form">

<h2>🌳 我的十年人生樹</h2>

<input id="trunk"
placeholder="現在的自己">

<textarea id="roots"
placeholder="六個樹根(每行一個)"></textarea>

<textarea id="leaves"
placeholder="六個葉片(每行一個)"></textarea>

<textarea id="flowers"
placeholder="四個花朵(每行一個)"></textarea>

<textarea id="fruits"
placeholder="兩個果實(每行一個)"></textarea>

<textarea id="letter"
rows="10"
placeholder="給十年後的自己"></textarea>

<button onclick="generatePoster()">
生成人生樹海報
</button>

</div>

<div id="result"></div>

</div>

<script>

function generatePoster(){

const roots=
document.getElementById("roots")
.value.split("\\n");

const leaves=
document.getElementById("leaves")
.value.split("\\n");

const flowers=
document.getElementById("flowers")
.value.split("\\n");

const fruits=
document.getElementById("fruits")
.value.split("\\n");

const trunk=
document.getElementById("trunk").value;

const letter=
document.getElementById("letter").value;

document.getElementById("result").innerHTML=`

<div id="poster">

<div class="left-panel">

<h2>💌 給十年後的自己</h2>

<div class="future-letter">
${letter.replace(/\\n/g,"<br>")}
</div>

</div>

<div class="tree">

<img src="tree-template.png">

<div class="fruit1 label">${fruits[0]||""}</div>
<div class="fruit2 label">${fruits[1]||""}</div>

<div class="flower1 label">${flowers[0]||""}</div>
<div class="flower2 label">${flowers[1]||""}</div>
<div class="flower3 label">${flowers[2]||""}</div>
<div class="flower4 label">${flowers[3]||""}</div>

<div class="leaf1 label">${leaves[0]||""}</div>
<div class="leaf2 label">${leaves[1]||""}</div>
<div class="leaf3 label">${leaves[2]||""}</div>
<div class="leaf4 label">${leaves[3]||""}</div>
<div class="leaf5 label">${leaves[4]||""}</div>
<div class="leaf6 label">${leaves[5]||""}</div>

<div class="trunk">${trunk}</div>

<div class="root1 label">${roots[0]||""}</div>
<div class="root2 label">${roots[1]||""}</div>
<div class="root3 label">${roots[2]||""}</div>
<div class="root4 label">${roots[3]||""}</div>
<div class="root5 label">${roots[4]||""}</div>
<div class="root6 label">${roots[5]||""}</div>

</div>

</div>

`;

}

</script>

</body>
</html>
